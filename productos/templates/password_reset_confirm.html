<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Nueva contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow" style="max-width: 450px; width: 100%;">
        <h4 class="mb-3 text-center">Ingresa tu nueva contraseña</h4>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-dark w-100 mt-2">Guardar nueva contraseña</button>
        </form>
    </div>
</body>
</html>
