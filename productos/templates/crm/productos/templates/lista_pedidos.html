<h1>📦 Pedidos</h1>

<table border="1" cellpadding="10">
    <tr>
        <th>Orden</th>
        <th>Fecha</th>
        <th>Total</th>
        <th>Estado</th>
        <th>Ver</th>
    </tr>

    {% for pedido in pedidos %}
    <tr>
        <td>{{ pedido.numero_orden }}</td>
        <td>{{ pedido.fecha }}</td>
        <td>${{ pedido.total }}</td>
        <td>{{ pedido.estado }}</td>
        <td>
            <a href="{% url 'detalle_pedido' pedido.id %}">🔍 Ver</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="5">No hay pedidos</td>
    </tr>
    {% endfor %}
</table>
