<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago No Completado | JoyasApp</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f9f9f9; text-align: center; padding: 50px 20px; color: #333; }
        .card { max-width: 500px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { color: #dc3545; font-size: 24px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; line-height: 1.5; margin-bottom: 30px; }
        .btn { display: inline-block; background: #000; color: #fff; padding: 12px 25px; border-radius: 6px; text-decoration: none; font-weight: bold; }
        .btn:hover { background: #333; }
    </style>
</head>
<body>
    <div class="card">
        <h1>⚠️ Pago No Completado</h1>
        <p>Hubo un inconveniente al procesar tu pago o la transacción fue cancelada. No se ha realizado ningún cargo a tu cuenta.</p>
        <a href="javascript:history.back()" class="btn">Intentar de nuevo</a>
    </div>
</body>
</html>
