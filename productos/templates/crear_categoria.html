{% extends 'base.html' %}
{% block content %}

<div class="container py-5" style="max-width: 600px;">
    <!-- Botón de Retorno -->
    <div class="mb-4">
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary btn-sm fw-semibold rounded-pill px-3">
            ⬅️ Volver al Dashboard
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <h2 class="fw-bold text-dark mb-4">📂 Crear Nueva Categoría</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="nombre" class="form-label fw-bold text-secondary">Nombre de la Categoría</label>
                <input type="text" class="form-control rounded-3 py-2" id="nombre" name="nombre" placeholder="Ej. Anillos, Oro 18K, Relojes..." required>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{% url 'dashboard' %}" class="btn btn-light rounded-3 px-4">Cancelar</a>
                <button type="submit" class="btn text-white fw-bold rounded-3 px-4" style="background: #2563eb;">
                    Guardar Categoría
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
