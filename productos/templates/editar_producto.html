{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <h2>✏️ Editar Producto</h2>

    <form method="POST" enctype="multipart/form-data" class="custom-form">
        {% csrf_token %}

        <fieldset>
            <legend>Información General</legend>
            
            <div class="form-group">
                <label for="nombre">Nombre del Producto</label>
                <input type="text" id="nombre" name="nombre" value="{{ producto.nombre }}" required>
            </div>

            <div class="form-group">
                <label for="referencia">SKU / Referencia</label>
                <input type="text" id="referencia" name="referencia" value="{{ producto.referencia }}">
            </div>

            <div class="form-group">
                <label for="categoria">Categoría</label>

                <select id="categoria" name="categoria">

                    {% for categoria in categorias %}
                    <option value="{{ categoria.id }}"
                        {% if producto.categoria.id == categoria.id %}
                            selected
                        {% endif %}>
            {{ categoria.nombre }}
                    </option>
                    {% endfor %}

                </select>
            </div>

            <div class="form-group">
                <label for="tipo_venta">Tipo de venta</label>
                <select id="tipo_venta" name="tipo_venta">
                    <option value="unidad" {% if producto.tipo_venta == 'unidad' %}selected{% endif %}>Por unidad</option>
                    <option value="gramo" {% if producto.tipo_venta == 'gramo' %}selected{% endif %}>Por gramos</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="stock">Stock Total</label>
                <input type="number" id="stock" name="stock" value="{{ producto.stock }}">
            </div>
        </fieldset>

    </fieldset>

        <fieldset class="grid-2-col">
            <legend>Costos y Precios (Unidad / Global)</legend>

        <div class="form-group">
            <label for="precio_costo">Precio de costo</label>
            <input type="number" step="0.01" id="precio_costo" name="precio_costo" value="{{ producto.precio_costo|stringformat:".2f" }}">
        </div>

        <div class="form-group">
            <label for="precio_detal">Precio Detal</label>
            <input type="number" step="0.01" id="precio_detal" name="precio_detal" value="{{ producto.precio_detal|stringformat:".2f" }}">
        </div>

        <div class="form-group">
            <label for="precio_semimayor">Precio SemiMayorista</label>
            <input type="number" step="0.01" id="precio_semimayor" name="precio_semimayor" value="{{ producto.precio_semimayor|stringformat:".2f" }}">
        </div>

        <div class="form-group">
            <label for="precio_mayor">Precio Mayorista</label>
            <input type="number" step="0.01" id="precio_mayor" name="precio_mayor" value="{{ producto.precio_mayor|stringformat:".2f" }}">
        </div>
    </fieldset>
        <fieldset class="grid-2-col">
            <legend>Configuración por Gramos</legend>

            <div class="form-group full-width">
                <label for="peso_producto">Peso del producto (gramos)</label>
                <input type="number" step="0.01" id="peso_producto" name="peso_producto" value="{{ producto.peso_producto }}">
            </div>

            <div class="form-group">
                <label for="precio_por_gramo_detal">Precio gramo detal</label>
                <input type="number" step="0.01" id="precio_por_gramo_detal" name="precio_por_gramo_detal" value="{{ producto.precio_por_gramo_detal }}">
            </div>

            <div class="form-group">
                <label for="precio_por_gramo_semimayor">Precio gramo semimayorista</label>
                <input type="number" step="0.01" id="precio_por_gramo_semimayor" name="precio_por_gramo_semimayor" value="{{ producto.precio_por_gramo_semimayor }}">
            </div>

            <div class="form-group">
                <label for="precio_por_gramo_mayor">Precio gramo mayorista</label>
                <input type="number" step="0.01" id="precio_por_gramo_mayor" name="precio_por_gramo_mayor" value="{{ producto.precio_por_gramo_mayor }}">
            </div>
        </fieldset>

        <fieldset>
            <legend>Detalles y Variantes</legend>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="destacado" name="destacado" {% if producto.destacado %}checked{% endif %}>
                <label for="destacado">Marcar como Producto destacado</label>
            </div>

            <div class="form-group">
                <label for="variantes">🎨 Variantes (Formato: Color|Talla|Stock)</label>
                <textarea id="variantes" name="variantes" rows="6">{% for variante in producto.variantes.all %}{{ variante.color }}|{{ variante.talla }}|{{ variante.stock }}{% if not forloop.last %}
                {% endif %}{% endfor %}</textarea>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" rows="4">{{ producto.descripcion }}</textarea>
            </div>
        </fieldset>

        <fieldset class="media-section">
            <legend>Multimedia</legend>
            
            {% if producto.imagen_principal %}
                <div class="current-image">
                    <p><strong>Imagen actual:</strong></p>
                    <img src="{{ producto.imagen_principal.url }}" alt="{{ producto.nombre }}">
                </div>
            {% endif %}

            <div class="form-group">
                <label for="imagen_principal">Cambiar imagen</label>
                <input type="file" id="imagen_principal" name="imagen_principal" class="file-input">
            </div>
        </fieldset>

        <button type="submit" class="btn-submit">
            💾 Guardar Cambios
        </button>

        <br>
        <a href="{% url 'mis_productos' %}"
            class="btn-volver">
            ← Volver
        </a>

    </form>
</div>                                                                                  

<style>
    .form-container {
        max-width: 700px;
        margin: 30px auto;
        padding: 20px;
        font-family: Arial, sans-serif;
    }
    .custom-form fieldset {
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 15px 20px;
        margin-bottom: 20px;
        background-color: #f9f9f9;
    }
    .custom-form legend {
        font-weight: bold;
        padding: 0 10px;
        color: #333;
    }
    .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 15px;
    }
    .form-group label {
        margin-bottom: 5px;
        font-weight: 600;
        font-size: 14px;
        color: #444;
    }
    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group select,
    .form-group textarea {
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }
    .form-group textarea {
        resize: vertical;
        width: 100%;
        box-sizing: border-box;
    }
    .grid-2-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }
    .grid-2-col legend {
        grid-column: span 2;
    }
    .full-width {
        grid-column: span 2;
    }
    .checkbox-group {
        flex-direction: row;
        align-items: center;
        gap: 10px;
        margin: 10px 0;
    }
    .checkbox-group label {
        margin-bottom: 0;
        cursor: pointer;
    }
    .current-image img {
        width: 150px;
        border-radius: 8px;
        border: 1px solid #ddd;
        margin-bottom: 10px;
    }
    .btn-submit {
        display: block;
        width: 100%;
        padding: 12px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
    }
    .btn-submit:hover {
        background-color: #218838;
    }

    .btn-volver{
        display:block;
        text-align:center;
        margin-top:10px;
        padding:12px;
        background:#6c757d;
        color:white;
        text-decoration:none;
        border-radius:6px;
        font-weight:bold;
    }

    .btn-volver:hover{
        background:#5a6268;
}
</style>
{% endblock %}
