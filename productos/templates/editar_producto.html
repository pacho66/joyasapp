{% extends 'base.html' %}

{% block content %}

<div style="max-width:600px; margin:auto; padding:20px;">

    <h2>✏️ Editar Producto</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <label>Nombre</label>
        <input
            type="text"
            name="nombre"
            value="{{ producto.nombre }}"
            required>

        <br><br>

        <label>Tipo de venta</label>
        <select name="tipo_venta">

            <option value="unidad"
                {% if producto.tipo_venta == 'unidad' %}selected{% endif %}>
                Por unidad
            </option>

            <option value="gramo"
                {% if producto.tipo_venta == 'gramo' %}selected{% endif %}>
                Por gramos
            </option>

        </select>

        <label>Precio de costo</label>

        <input
            type="number"
            step="0.01"
            name="precio_costo"
            value="{{ producto.precio_costo }}">

        <br><br>

        <label>Precio Detal</label>
        <input
            type="number"
            step="0.01"
            name="precio_detal"
            value="{{ producto.precio_detal }}">

        <br><br>

        <label>Precio SemiMayorista</label>
        <input
            type="number"
            step="0.01"
            name="precio_semimayor"
            value="{{ producto.precio_semimayor }}">

        <br><br>

        <label>Precio Mayorista</label>
        <input
            type="number"
            step="0.01"
            name="precio_mayor"
            value="{{ producto.precio_mayor }}">

        <br><br>

        <label>Peso del producto (gramos)</label>
        <input
            type="number"
            step="0.01"
            name="peso_producto"
            value="{{ producto.peso_producto }}">

        <br><br>

        <label>Precio gramo detal</label>
        <input
            type="number"
            step="0.01"
            name="precio_por_gramo_detal"
            value="{{ producto.precio_por_gramo_detal }}">

        <br><br>

        <label>Precio gramo semimayorista</label>
        <input
            type="number"
            step="0.01"
            name="precio_por_gramo_semimayor"
            value="{{ producto.precio_por_gramo_semimayor }}">

        <br><br>

        <label>Precio gramo mayorista</label>
        <input
            type="number"
            step="0.01"
            name="precio_por_gramo_mayor"
            value="{{ producto.precio_por_gramo_mayor }}">

        <br><br>

        <label>
            <input
                type="checkbox"
                name="destacado"
                {% if producto.destacado %}checked{% endif %}>
            Producto destacado
        </label>

        <br><br>

        <label>Stock</label>
        <input
            type="number"
            name="stock"
            value="{{ producto.stock }}">

        <br><br>

        <label>Descripción</label>

        <textarea
            name="descripcion"
            rows="5"
            style="width:100%;">{{ producto.descripcion }}</textarea>

        <br><br>

        {% if producto.imagen_principal %}
            <p><strong>Imagen actual</strong></p>

            <img
                src="{{ producto.imagen_principal.url }}"
                width="180"
                style="border-radius:10px;">
        {% endif %}

        <br><br>

        <label>Cambiar imagen</label>

        <input
            type="file"
            name="imagen_principal">

        <br><br>

        <button type="submit">
            💾 Guardar Cambios
        </button>

    </form>

</div>

{% endblock %}
