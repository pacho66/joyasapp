{% extends 'base.html' %}

{% block content %}

<div style="max-width:600px;margin:auto;padding:20px;">

<h2>✏️ Editar Producto</h2>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<input
type="text"
name="nombre"
value="{{ producto.nombre }}"
required>

<br><br>

<label>Tipo de venta</label>
<select name="tipo_venta">
    <option value="unidad">Por unidad</option>
    <option value="gramo">Por gramos</option>
</select>

<br><br>

<label>Precio Detal</label>
<input type="number" step="0.01" name="precio_detal">

<br><br>

<label>Precio SemiMayorista</label>
<input type="number" step="0.01" name="precio_semimayor">

<br><br>

<label>Precio Mayorista</label>
<input type="number" step="0.01" name="precio_mayor">

<br><br>

<label>Peso del producto (gramos)</label>
<input type="number" step="0.01" name="peso_producto">

<br><br>

<label>Precio gramo detal</label>
<input type="number" step="0.01" name="precio_por_gramo_detal">

<br><br>

<label>Precio gramo semimayorista</label>
<input type="number" step="0.01" name="precio_por_gramo_semimayor">

<br><br>

<label>Precio gramo mayorista</label>
<input type="number" step="0.01" name="precio_por_gramo_mayor">

<br><br>

<label>
<input type="checkbox" name="destacado">
Producto destacado

</label>

<br><br>

<input
type="number"
name="stock"
value="{{ producto.stock }}">

<br><br>

<textarea
name="descripcion">{{ producto.descripcion }}</textarea>

<br><br>

<button type="submit">
💾 Guardar Cambios
</button>

</form>

</div>

{% endblock %}
