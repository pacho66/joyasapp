{% extends 'base.html' %}
{% block content %}

<style>
.wrap{
    max-width:700px;
    margin:auto;
    padding:20px;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:25px;
    box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.titulo{
    font-size:26px;
    margin-bottom:10px;
}

.sub{
    color:#666;
    margin-bottom:20px;
    font-size:14px;
}

.grupo{
    margin-bottom:15px;
}

input, select{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
}

.botones{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

.btn{
    padding:10px 15px;
    border-radius:8px;
    border:none;
    font-weight:bold;
}

.guardar{
    background:#28a745;
    color:white;
}

.volver{
    background:#111;
    color:white;
}

@media(max-width:768px){
    .titulo{
        font-size:22px;
    }
}
</style>

<div class="wrap">
<div class="card">

<h2 class="titulo">⚙️ Configurar Negocio</h2>
<p class="sub">Personaliza tu tienda (SaaS)</p>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="grupo">
        <label>🏪 Nombre tienda</label>
        {{ form.nombre_tienda }}
    </div>

    <div class="grupo">
        <label>📲 WhatsApp</label>
        {{ form.whatsapp }}
    </div>

    <div class="grupo">
        <label>📧 Correo</label>
        {{ form.correo_negocio }}
    </div>

    <div class="grupo">
        <label>📍 Dirección</label>
        {{ form.direccion }}
    </div>

    <div class="grupo">
        <label>🌎 Ciudad</label>
        {{ form.ciudad }}
    </div>

    <div class="grupo">
        <label>🎨 Color primario</label>
        <input type="color" name="color_primario" value="{{ perfil.color_primario }}">
    </div>

    <div class="grupo">
        <label>🎨 Color secundario</label>
        <input type="color" name="color_secundario" value="{{ perfil.color_secundario }}">
    </div>

    <div class="grupo">
        <label>🖼️ Logo</label>
        <input type="file" name="logo">
    </div>

    {% if perfil.logo %}
        <p>Logo actual:</p>
        <img src="{{ perfil.logo.url }}" style="max-height:80px;">
    {% endif %}

    <div class="botones">
        <button type="submit" class="btn guardar">💾 Guardar</button>
        <a href="{% url 'dashboard' %}" class="btn volver">⬅️ Volver</a>
    </div>

</form>

</div>
</div>

{% endblock %}
