{% extends 'base.html' %}
{% load static %}
{% block content %}

<style>
    /* 1. Forzar espaciado elegante entre los bloques de tu formulario */
    .mb-3, .mb-4 {
        margin-bottom: 1.8rem !important;
    }
    
    /* 2. Evita que el botón flotante de WhatsApp tape el botón de "Publicar" al final */
    body {
        padding-bottom: 100px !important;
    }

    /* 3. Optimización exclusiva para pantallas de celular */
    @media (max-width: 768px) {
        /* Le da aire interno a la tarjeta blanca */
        .card {
            padding: 20px 15px !important;
        }
        
        /* Hace que campos compartidos (como Fecha Inicio/Fin o Ícono/Título) se pongan uno abajo del otro */
        .row.g-2 {
            display: flex !important;
            flex-direction: column !important;
            gap: 15px !important;
        }
        
        /* Fuerza a que los campos ocupen el ancho completo en el celular sin aplastarse */
        .col-4, .col-8, .col-6 {
            width: 100% !important;
        }
    }
</style>

<div class="container my-4" style="max-width: 1100px;">
    <div class="row g-4">
        
        <!-- COLUMNA IZQUIERDA: FORMULARIO DE CONFIGURACIÓN -->
        <div class="col-12 col-lg-6">
            <div class="card shadow-sm border-0 p-4" style="border-radius: 20px; background-color: #ffffff;">
                <div class="mb-4">
                    <span class="badge bg-dark text-uppercase px-3 py-2 rounded-pill small" style="letter-spacing: 1px;">Marketing Visual</span>
                    <h2 class="fw-black text-dark mt-2 mb-1">📣 Centro de Promociones</h2>
                    <p class="text-muted small">Configura la vitrina principal de tu joyería para el celular.</p>
                </div>

                <!-- Formulario con soporte para subida de imágenes -->
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <!-- Nombre de la Tienda -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase text-secondary">Nombre de la Tienda</label>
                        <input type="text" name="nombre_tienda" value="{{ perfil.nombre_tienda|default:'' }}" class="form-control p-2" style="border-radius: 10px; font-size: 0.9rem;" placeholder="Ej: PG Joyas o Platería González">
                    </div>

                    <!-- 🌐 CONFIGURACIÓN DE REDES SOCIALES (Corregido y Cerrado) -->
                    <div class="card p-3 bg-light rounded-3 border mb-4">
                        <span class="badge bg-secondary text-uppercase px-2 py-1 rounded-pill small mb-3 align-self-start" style="font-size: 0.7rem;">Enlaces Comerciales</span>
    
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase text-secondary">Usuario de Instagram</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white" style="border-radius: 10px 0 0 10px; font-size: 0.9rem;">@</span>
                                <input type="text" name="instagram" value="{{ perfil.instagram|default:'' }}" class="form-control p-2" style="border-radius: 0 10px 10px 0; font-size: 0.9rem;" placeholder="ej: plateriagonzalez">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase text-secondary">Enlace de Facebook (URL Completa)</label>
                            <input type="url" name="facebook" value="{{ perfil.facebook|default:'' }}" class="form-control p-2" style="border-radius: 10px; font-size: 0.9rem;" placeholder="https://facebook.com/tu-pagina">
                        </div>

                        <div class="mb-0">
                            <label class="form-label small fw-bold text-uppercase text-secondary">Usuario de TikTok</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white" style="border-radius: 10px 0 0 10px; font-size: 0.9rem;">@</span>
                                <input type="text" name="tiktok" value="{{ perfil.tiktok|default:'' }}" class="form-control p-2" style="border-radius: 0 10px 10px 0; font-size: 0.9rem;" placeholder="ej: plateriagonzalez">
                            </div>
                        </div>
                    </div> <!-- ✓ Aquí cierra correctamente la tarjeta de Redes Sociales -->

                    <!-- Título e Ícono -->
                    <div class="row g-2 mb-3">
                        <div class="col-4">
                            <label class="form-label small fw-bold text-uppercase text-secondary">Ícono</label>
                            <select id="input_icono" name="icono" class="form-select p-2" style="border-radius: 10px; font-size: 0.9rem;">
                                <option value="💎" {% if perfil.banner_icono == "💎" %}selected{% endif %}>💎 Diamante</option>
                                <option value="✨" {% if perfil.banner_icono == "✨" %}selected{% endif %}>✨ Destello</option>
                                <option value="🎁" {% if perfil.banner_icono == "🎁" %}selected{% endif %}>🎁 Regalo</option>
                                <option value="🔥" {% if perfil.banner_icono == "🔥" %}selected{% endif %}>🔥 Tendencia</option>
                                <option value="⭐" {% if perfil.banner_icono == "⭐" %}selected{% endif %}>⭐ Estrella</option>
                                <option value="🚚" {% if perfil.banner_icono == "🚚" %}selected{% endif %}>🚚 Envío</option>
                            </select>
                        </div>
                        <div class="col-8">
                            <label class="form-label small fw-bold text-uppercase text-secondary">Título del Banner</label>
                            <input type="text" id="input_titulo" name="titulo" value="{{ perfil.banner_titulo|default:'¡Nueva Colección!' }}" class="form-control p-2" style="border-radius: 10px; font-size: 0.9rem;" placeholder="Ej: Nueva Colección Oro 18K">
                        </div>
                    </div>

                    <!-- Mensaje Promocional -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase text-secondary">Mensaje Corto</label>
                        <textarea id="input_mensaje" name="banner_texto" rows="2" class="form-control p-2" style="border-radius: 10px; font-size: 0.9rem;" placeholder="Describe la oferta...">{{ perfil.banner_texto|default:'' }}</textarea>
                    </div>

                    <!-- Subir Imagen de Fondo del Banner -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase text-secondary">Imagen de Fondo del Banner</label>
                        <input type="file" name="banner_imagen" class="form-control p-2" style="border-radius: 10px; font-size: 0.9rem;" accept="image/*">
                        {% if perfil.banner_imagen %}
                            <div class="form-text text-success small mt-1">✓ Imagen actual guardada.</div>
                        {% endif %}
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase text-secondary">Estilo Visual</label>
                        <select id="input_color" name="estilo_color" class="form-select p-2" style="border-radius: 10px; font-size: 0.9rem;">
                            <option value="dorado" {% if perfil.estilo_color == "dorado" %}selected{% endif %}>🟡 Dorado Premium</option>
                            <option value="negro" {% if perfil.estilo_color == "negro" %}selected{% endif %}>⚫ Negro Elegante</option>
                            <option value="azul" {% if perfil.estilo_color == "azul" %}selected{% endif %}>🔵 Azul Corporativo</option>
                            <option value="verde" {% if perfil.estilo_color == "verde" %}selected{% endif %}>🟢 Verde Financiero</option>
                            <option value="rojo" {% if perfil.estilo_color == "rojo" %}selected{% endif %}>🔴 Rojo Oferta</option>
                        </select>
                    </div>

                    <!-- Programación Automática -->
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-bold text-uppercase text-secondary">Fecha Inicio</label>
                            <input type="date" name="fecha_inicio" value="{{ perfil.fecha_inicio|date:'Y-m-d' }}" class="form-control p-2" style="border-radius: 10px; font-size: 0.9rem;">
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-bold text-uppercase text-secondary">Fecha Fin</label>
                            <input type="date" name="fecha_fin" value="{{ perfil.fecha_fin|date:'Y-m-d' }}" class="form-control p-2" style="border-radius: 10px; font-size: 0.9rem;">
                        </div>
                    </div>

                    <!-- Botón de Acción (CTA) -->
                    <div class="p-3 bg-light rounded-3 border mb-4">
                        <div class="form-check mb-2">
                            <input type="checkbox" id="input_mostrar_boton" name="mostrar_boton" class="form-check-input" {% if perfil.mostrar_boton %}checked{% endif %}>
                            <label class="form-check-label small fw-bold text-uppercase text-secondary" for="input_mostrar_boton">
                                Incluir Botón de Acción
                            </label>
                        </div>
                        <div id="wrapper_boton" class="row g-2 d-none">
                            <div class="col-6">
                                <input type="text" id="input_boton_texto" name="boton_texto" value="{{ perfil.boton_texto|default:'Comprar ahora' }}" class="form-control p-2" style="border-radius: 8px; font-size: 0.85rem;" placeholder="Texto botón">
                            </div>
                            <div class="col-6">
                                <input type="text" id="input_boton_enlace" name="boton_enlace" value="{{ perfil.boton_enlace|default:'/catalogo/' }}" class="form-control p-2" style="border-radius: 8px; font-size: 0.85rem;" placeholder="Enlace (/categoria/oro)">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-2.5 fw-bold" style="border-radius: 12px; font-size: 1rem;">
                        🚀 Publicar Campaña
                    </button>
                </form>
            </div>
        </div>
        
        <!-- (Columna Derecha de Vista Previa se mantiene intacta igual que antes) -->

<!-- JAVASCRIPT SEGURO PARA EL RENDER EN VIVO -->
<script>
    function actualizarPreview() {
        // Actualizar textos
        document.getElementById('preview_titulo').innerText = document.getElementById('input_titulo').value || '¡Nueva Colección!';
        document.getElementById('preview_mensaje').innerText = document.getElementById('input_mensaje').value || 'Completa los campos...';
        document.getElementById('preview_icono').innerText = document.getElementById('input_icono').value;
        
        // Aplicar estilos de fondo dinámicos directos
        const banner = document.getElementById('preview_banner');
        banner.style.background = document.getElementById('input_color').value.split(';')[0];
        
        // Controlar visibilidad del botón de acción
        const mostrarBoton = document.getElementById('input_mostrar_boton').checked;
        const wrapperBoton = document.getElementById('wrapper_boton');
        const btnPreview = document.getElementById('preview_boton');
        
        if (mostrarBoton) {
            wrapperBoton.classList.remove('d-none');
            btnPreview.classList.remove('d-none');
            btnPreview.innerText = document.getElementById('input_boton_texto').value || 'Comprar ahora';
        } else {
            wrapperBoton.classList.add('d-none');
            btnPreview.classList.add('d-none');
        }
    }

    // Escuchas de eventos
    document.getElementById('input_titulo').addEventListener('input', actualizarPreview);
    document.getElementById('input_mensaje').addEventListener('input', actualizarPreview);
    document.getElementById('input_icono').addEventListener('change', actualizarPreview);
    document.getElementById('input_color').addEventListener('change', actualizarPreview);
    document.getElementById('input_mostrar_boton').addEventListener('change', actualizarPreview);
    document.getElementById('input_boton_texto').addEventListener('input', actualizarPreview);
    
    // Lanzar al cargar la página
    document.addEventListener("DOMContentLoaded", actualizarPreview);
</script>

{% endblock %}
