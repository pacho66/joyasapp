{% extends 'base.html' %} <!-- O el layout base de tu panel -->

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0 rounded-4 p-4">
                <div class="card-body">
                    <h2 class="mb-3 text-center fw-bold">⚙️ Calculadora de Taller</h2>
                    <p class="text-muted text-center mb-4">Producto base: <strong>{{ producto.nombre }}</strong></p>

                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="nombre_variante" class="form-label fw-semibold">Nombre de la Variante / Talla / Detalle</label>
                            <input type="text" class="form-control" id="nombre_variante" name="nombre_variante" placeholder="Ej: Oro Amarillo Talla 7" value="Estándar" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="gramos" class="form-label fw-semibold">Peso en Gramos (g)</label>
                                <input type="number" step="0.01" class="form-control" id="gramos" name="gramos" placeholder="0.00" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="precio_gramo_metal" class="form-label fw-semibold">Precio del Gramo de Metal</label>
                                <input type="number" step="0.01" class="form-control" id="precio_gramo_metal" name="precio_gramo_metal" placeholder="0.00" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="porcentaje_merma" class="form-label fw-semibold">Porcentaje de Merma (Ej: 0.10 para 10%)</label>
                                <input type="number" step="0.01" class="form-control" id="porcentaje_merma" name="porcentaje_merma" value="0.10">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="costo_mano_obra" class="form-label fw-semibold">Costo de Mano de Obra</label>
                                <input type="number" step="0.01" class="form-control" id="costo_mano_obra" name="costo_mano_obra" value="0.00">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="color" class="form-label fw-semibold">Color / Material</label>
                                <input type="text" class="form-control" id="color" name="color" placeholder="Ej: Oro 18k">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="talla" class="form-label fw-semibold">Talla / Medida</label>
                                <input type="text" class="form-control" id="talla" name="talla" placeholder="Ej: 7 / Estándar">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="stock" class="form-label fw-semibold">Stock Inicial</label>
                                <input type="number" class="form-control" id="stock" name="stock" value="1">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="porcentaje_ganancia" class="form-label fw-semibold">Porcentaje de Ganancia (Ej: 0.30 para 30%)</label>
                            <input type="number" step="0.01" class="form-control" id="porcentaje_ganancia" name="porcentaje_ganancia" value="0.30">
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4 fw-bold">💾 Guardar y Calcular Variante</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
