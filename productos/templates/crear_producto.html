{% extends 'base.html' %}

{% block content %}

<div style="
max-width:600px;
margin:auto;
padding:20px;">

<h2>✏️ Editar Producto</h2>

<form method="POST"
      enctype="multipart/form-data">

{% csrf_token %}

<input
type="text"
name="nombre"
value="{{ producto.nombre }}"
required
style="
width:100%;
padding:12px;">

<br><br>

<select name="categoria" required>

{% for categoria in categorias %}

<option
value="{{ categoria.id }}"

{% if categoria.id == producto.categoria.id %}
selected
{% endif %}>

{{ categoria.nombre }}

</option>

{% endfor %}

</select>

<br><br>

<input
type="number"
name="precio"
value="{{ producto.precio_detal }}">

<br><br>

<input
type="number"
name="stock"
value="{{ producto.stock }}">

<br><br>

<textarea
name="descripcion"
style="
width:100%;
height:120px;">{{ producto.descripcion }}</textarea>

<br><br>

<input
type="file"
name="imagen"
accept="image/*">

<br><br>

<button
type="submit"
style="
padding:12px 20px;
background:#25D366;
color:white;
border:none;
border-radius:8px;">

💾 Guardar Cambios

</button>

</form>

</div>

{% endblock %}
