{% extends 'base.html' %}

{% block content %}

<div style="max-width:600px;margin:auto;padding:20px;">

<h2>💎 Nuevo Producto</h2>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<label>Nombre</label>
<input type="text"
name="nombre"
placeholder="Nombre producto"
required>

<br><br>

<label>Categoría</label>
<select name="categoria" required>

<option value="">
Seleccione categoría
</option>

{% for categoria in categorias %}
<option value="{{ categoria.id }}">
{{ categoria.nombre }}
</option>
{% endfor %}

</select>

<br><br>

<label>Tipo de venta</label>
<select name="tipo_venta">
    <option value="unidad">Por unidad</option>
    <option value="gramo">Por gramos</option>
</select>

<br><br>

<label>Precio de costo</label>
<input type="number"
step="0.01"
name="precio_costo">

<br><br>

<label>Precio Detal</label>
<input type="number"
step="0.01"
name="precio_detal">

<br><br>

<label>Precio SemiMayorista</label>
<input type="number"
step="0.01"
name="precio_semimayor">

<br><br>

<label>Precio Mayorista</label>
<input type="number"
step="0.01"
name="precio_mayor">

<br><br>

<label>Stock</label>
<input type="number"
name="stock">

<br><br>

<label>Peso producto (gramos)</label>
<input type="number"
step="0.01"
name="peso_producto">

<br><br>

<label>Precio gramo detal</label>
<input type="number"
step="0.01"
name="precio_por_gramo_detal">

<br><br>

<label>Precio gramo semimayorista</label>
<input type="number"
step="0.01"
name="precio_por_gramo_semimayor">

<br><br>

<label>Precio gramo mayorista</label>
<input type="number"
step="0.01"
name="precio_por_gramo_mayor">

<br><br>

<label>
<input type="checkbox"
name="destacado">
Producto destacado
</label>

<br><br>

<label>Descripción</label>

<textarea
name="descripcion"
placeholder="Descripción"></textarea>

<br><br>

<label>SKU / Referencia</label>

<input
    type="text"
    name="referencia"
    placeholder="SKU o referencia">

<br><br>

<label>Imagen principal</label>

<input
type="file"
name="imagen_principal"
accept="image/*">

<br><br>

<label>Certificado</label>

<input
    type="file"
    name="certificado">

<br><br>

<label>Video</label>

<input
    type="file"
    name="video"
    accept="video/*">

<br><br>

<button type="submit">
💾 Guardar Producto
</button>

</form>

</div>

{% endblock %}
