<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - JoyasApp</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f, #2c3e50);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        .login-title {
            text-align: center;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .logo {
            display: block;
            margin: 0 auto 15px;
            width: 120px;
            max-height: 120px;
            object-fit: contain;
        }

        .btn-login {
            width: 100%;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <!-- LOGO -->
    <img src="{% static 'img/logo.jpg' %}" class="logo" alt="Logo" onerror="this.style.display='none';">

    <h4 class="login-title">Recuperar Contraseña</h4>
    <p class="text-center text-muted mb-4 small">Ingresa tu correo electrónico y te enviaremos las instrucciones.</p>

    <!-- MENSAJES / ERRORES -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger text-center">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <!-- Renderizamos los campos del formulario de Django de forma limpia con Bootstrap -->
        <div class="mb-3">
            {{ form.as_p }}
        </div>

        <button type="submit" class="btn btn-dark btn-login mt-2">
            Enviar enlace de recuperación
        </button>
    </form>

    <div class="text-center mt-4">
        <a href="{% url 'login' %}" class="text-muted text-decoration-none small">
            <i class="bi bi-arrow-left"></i> Volver al inicio de sesión
        </a>
    </div>

</div>

</body>
</html>
