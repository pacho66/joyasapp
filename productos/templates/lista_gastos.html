{% extends "base.html" %}

{% block content %}

<h2 style="text-align:center;">💸 Historial de Gastos</h2>

<table style="width:100%; margin-top:20px;">
    <tr>
        <th>Concepto</th>
        <th>Monto</th>
        <th>Fecha</th>
    </tr>

    {% for g in gastos %}
    <tr>
        <td>{{ g.concepto }}</td>
        <td>${{ g.monto }}</td>
        <td>{{ g.fecha }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3">No hay gastos</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
