<div style="
max-width:420px;
margin:40px auto;
padding:25px;
border:1px solid #ddd;
border-radius:10px;
background:white;
">

<h2 style="text-align:center;">Crear cuenta</h2>

<form method="post">
    {% csrf_token %}

    {% if error %}
        <p style="color:red;font-weight:bold;text-align:center;">
            {{ error }}
        </p>
    {% endif %}

    <p>Usuario</p>
    {{ form.username }}
    <hr>

    <p>Correo</p>
    {{ form.email }}
    <hr>

    <p>Contraseña</p>
    {{ form.password }}
    <hr>

    <p>Confirmar contraseña</p>
    {{ form.confirmar_password }}
    <hr>

    <p>Nombre tienda</p>
    {{ form.nombre_tienda }}
    <hr>

    <p>WhatsApp</p>
    {{ form.whatsapp }}
    <hr>

    <button type="submit" style="
    width:100%;
    background:black;
    color:white;
    padding:12px;
    border:none;
    border-radius:6px;
    font-size:16px;">
        Registrarme
    </button>

</form>
</div>
