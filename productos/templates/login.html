<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f, #2c3e50);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        .login-title {
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .logo {
            display: block;
            margin: 0 auto 15px;
            width: 80px;
        }

        .btn-login {
            width: 100%;
            font-size: 18px;
        }

        .toggle-password {
            cursor: pointer;
            position: absolute;
            right: 15px;
            top: 45px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <!-- LOGO -->
    <img src="/media/logo.jpg" class="logo" alt="Logo">

    <h4 class="login-title">Bienvenido</h4>
    <p class="text-center text-muted">Ingresa a tu tienda</p>

    <!-- MENSAJES -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger text-center">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Usuario</label>
            <input type="text" name="username" class="form-control form-control-lg" required>
        </div>

        <div class="mb-3 position-relative">
            <label>Contraseña</label>
            <input type="password" id="password" name="password" class="form-control form-control-lg" required>
            <i class="bi bi-eye toggle-password" onclick="togglePassword()"></i>
        </div>

        <button type="submit" class="btn btn-dark btn-login">
            Entrar
        </button>
    </form>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const icon = document.querySelector(".toggle-password");

    if (password.type === "password") {
        password.type = "text";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");
    } else {
        password.type = "password";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");
    }
}
</script>

</body>
</html>
